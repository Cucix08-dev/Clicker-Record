<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Timer + Score</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>SCORE: <span id="score">0</span></h2>

    <h2>TIMER: <span id="timer2">0</span></h2>

    <div id="timer1"></div>

    <div id="buttons-container">
        <input type="submit" class="orange-btn" value="A" id="btnA">
        <input type="submit" class="orange-btn" value="B" id="btnB">
        <input type="submit" class="orange-btn" value="C" id="btnC">
        <input type="submit" class="orange-btn" value="D" id="btnD">
    </div>

    <button id="startBtn">START</button>

    <script src="script.js"></script>

</body>
</html>
